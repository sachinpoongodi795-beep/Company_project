<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="logoGradAccent" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Isometric Tech Hexagon -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linejoin="round" fill="rgba(10, 17, 40, 0.6)"/>
  
  <!-- Inner Dynamic Circuit Nodes -->
  <path d="M24,4 L24,24 L42,34" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M24,24 L6,34" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central Tech Core -->
  <circle cx="24" cy="24" r="5" fill="url(#logoGradAccent)" filter="url(#logoGlow)"/>
  <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
  
  <!-- Satellite Connectivity Dots -->
  <circle cx="24" cy="4" r="2.5" fill="#38BDF8"/>
  <circle cx="42" cy="14" r="2.5" fill="#06B6D4"/>
  <circle cx="42" cy="34" r="2.5" fill="#0284C7"/>
  <circle cx="24" cy="44" r="2.5" fill="#38BDF8"/>
  <circle cx="6" cy="34" r="2.5" fill="#06B6D4"/>
  <circle cx="6" cy="14" r="2.5" fill="#0284C7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="540" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F26"/>
      <stop offset="1" stop-color="#0B1B44"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="540" height="420" rx="20" fill="url(#cyberBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Perspective Isometric Grid Lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="360" x2="500" y2="360"/>
    <line x1="80" y1="300" x2="460" y2="300"/>
    <line x1="120" y1="240" x2="420" y2="240"/>
    <line x1="160" y1="180" x2="380" y2="180"/>
    
    <line x1="40" y1="360" x2="270" y2="140"/>
    <line x1="500" y1="360" x2="270" y2="140"/>
    <line x1="180" y1="360" x2="270" y2="140"/>
    <line x1="360" y1="360" x2="270" y2="140"/>
  </g>

  <!-- High-Level Cloud Core Cluster -->
  <g transform="translate(270, 150)">
    <!-- Concentric Orbit Rings -->
    <circle r="75" stroke="#0284C7" stroke-dasharray="4 6" stroke-width="1.5" opacity="0.4"/>
    <circle r="105" stroke="#06B6D4" stroke-dasharray="6 8" stroke-width="1.2" opacity="0.3"/>
    
    <!-- Central Kernel Core -->
    <circle r="36" fill="url(#blueGlow)" filter="url(#glowFilter)" opacity="0.9"/>
    <circle r="22" fill="#0A1128"/>
    <!-- Microchip Icon inside Core -->
    <rect x="-10" y="-10" width="20" height="20" rx="4" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
  </g>

  <!-- Node 1: API Gateway (Top Left) -->
  <g transform="translate(110, 110)">
    <rect width="130" height="64" rx="10" fill="#0F1F47" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="24" cy="32" r="10" fill="rgba(2,132,199,0.3)"/>
    <circle cx="24" cy="32" r="4" fill="#38BDF8"/>
    <text x="44" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">API Gateway</text>
    <text x="44" y="44" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">99.99% SLA</text>
  </g>

  <!-- Node 2: Distributed Microservices (Top Right) -->
  <g transform="translate(360, 95)">
    <rect width="135" height="64" rx="10" fill="#0F1F47" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="24" cy="32" r="10" fill="rgba(6,182,212,0.3)"/>
    <circle cx="24" cy="32" r="4" fill="#06B6D4"/>
    <text x="44" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Microservices</text>
    <text x="44" y="44" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9">14 Clusters Active</text>
  </g>

  <!-- Node 3: AI Inference Engine (Bottom Left) -->
  <g transform="translate(70, 270)">
    <rect width="145" height="68" rx="10" fill="#0F1F47" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="24" cy="34" r="10" fill="rgba(129,140,248,0.3)"/>
    <circle cx="24" cy="34" r="4" fill="#818CF8"/>
    <text x="44" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Neural Pipeline</text>
    <text x="44" y="46" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="9">&lt; 14ms Inference</text>
  </g>

  <!-- Node 4: Sharded Data Lake (Bottom Right) -->
  <g transform="translate(330, 265)">
    <rect width="145" height="68" rx="10" fill="#0F1F47" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="24" cy="34" r="10" fill="rgba(56,189,248,0.3)"/>
    <circle cx="24" cy="34" r="4" fill="#38BDF8"/>
    <text x="44" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Sharded Database</text>
    <text x="44" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">Postgres + Redis</text>
  </g>

  <!-- Dynamic Animated Vector Connectors -->
  <path d="M190,142 L240,150" stroke="url(#nodeGrad1)" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M360,130 L300,150" stroke="url(#nodeGrad1)" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M180,285 L245,180" stroke="url(#nodeGrad1)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M350,280 L295,185" stroke="url(#nodeGrad1)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Live Pulse Indicators -->
  <circle cx="240" cy="150" r="3" fill="#38BDF8"/>
  <circle cx="300" cy="150" r="3" fill="#06B6D4"/>
  <circle cx="245" cy="180" r="3" fill="#818CF8"/>
  <circle cx="295" cy="185" r="3" fill="#38BDF8"/>

  <!-- Real-time throughput code pill bottom center -->
  <g transform="translate(195, 355)">
    <rect width="150" height="28" rx="14" fill="#050B1A" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">84,200 req / sec</text>
  </g>
</svg>
